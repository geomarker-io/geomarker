on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to build and publish
        required: true
        type: string

name: release

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      R_GEOMARKER_NO_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Verify package and draft release versions
        shell: bash
        run: |
          package_version="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"

      - name: Build and check package
        shell: bash
        run: |
          R CMD build . --no-manual
          R CMD check geomarker_*.tar.gz --no-manual --as-cran

      - name: Publish release
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
